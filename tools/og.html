<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>og poster renderer</title>
<style>body{margin:0;background:#333}canvas{display:block}</style></head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// 1200×630 Open Graph poster for the tide-games fleet index — the harbor,
// painted with the games' own vocabularies: the regatta's sea and boat, and
// one motif from each vessel moored along the bottom.
const cv = document.getElementById('og'), ctx = cv.getContext('2d');
const W = 1200, H = 630;
const SHORE = 210;

// sky
let g = ctx.createLinearGradient(0,0,0,SHORE+120);
g.addColorStop(0,'#dff0fa'); g.addColorStop(1,'#bfe2ef');
ctx.fillStyle=g; ctx.fillRect(0,0,W,SHORE+120);
const sg = ctx.createRadialGradient(W-200,80,6,W-200,80,100);
sg.addColorStop(0,'#fff6d8'); sg.addColorStop(0.35,'rgba(255,244,204,.65)'); sg.addColorStop(1,'rgba(255,244,204,0)');
ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W-200,80,100,0,7); ctx.fill();
ctx.fillStyle='rgba(255,255,255,.9)';
[[220,60],[600,44],[900,74]].forEach(([cx,cy])=>{
  for(let p=0;p<4;p++){ ctx.beginPath(); ctx.arc(cx+p*26-38, cy+(p%2?6:0), 18-(p%2)*4, 0, 7); ctx.fill(); }
});
// headland, two planes + lighthouse
ctx.fillStyle='#c2d8cd';
ctx.beginPath(); ctx.moveTo(0,SHORE+16);
ctx.quadraticCurveTo(W*0.3,SHORE-56,W*0.62,SHORE+8);
ctx.quadraticCurveTo(W*0.8,SHORE+40,W,SHORE+6); ctx.lineTo(W,SHORE+90); ctx.lineTo(0,SHORE+90); ctx.fill();
ctx.fillStyle='#93b8a2';
ctx.beginPath(); ctx.moveTo(0,SHORE+34);
ctx.quadraticCurveTo(W*0.18,SHORE-36,W*0.38,SHORE+24);
ctx.quadraticCurveTo(W*0.55,SHORE+56,W,SHORE+30); ctx.lineTo(W,SHORE+90); ctx.lineTo(0,SHORE+90); ctx.fill();
const lx = W*0.2;
ctx.fillStyle='#ddd6c4'; ctx.fillRect(lx-9, SHORE-62, 18, 56);
ctx.fillStyle='#c94f4f'; ctx.fillRect(lx-9, SHORE-62, 18, 12); ctx.fillRect(lx-9, SHORE-35, 18, 10);
ctx.fillStyle='#3d4a55'; ctx.fillRect(lx-12, SHORE-69, 24, 9);
ctx.strokeStyle='rgba(61,74,85,.55)'; ctx.lineWidth=1.5; ctx.strokeRect(lx-9.5, SHORE-62.5, 19, 57);
// surf line + sea
ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3;
ctx.beginPath(); ctx.moveTo(0,SHORE+64); ctx.quadraticCurveTo(W*0.5,SHORE+78,W,SHORE+66); ctx.stroke();
g = ctx.createLinearGradient(0,SHORE+60,0,H);
g.addColorStop(0,'#a4d4e4'); g.addColorStop(0.4,'#79b7cf');
g.addColorStop(0.75,'#5197b6'); g.addColorStop(1,'#3a7d9c');
ctx.fillStyle=g; ctx.fillRect(0,SHORE+60,W,H);
// wave bands
const bands = [
  { y0:SHORE+96,  gap:26, amp:2,   a:.18, w:1.4 },
  { y0:SHORE+180, gap:38, amp:3,   a:.3,  w:2.2 },
  { y0:SHORE+290, gap:50, amp:4.2, a:.42, w:3 },
];
for(const b of bands){
  ctx.strokeStyle=`rgba(255,255,255,${b.a})`; ctx.lineWidth=b.w;
  for(let r=0;r<3;r++){
    const y = b.y0 + r*b.gap;
    ctx.beginPath();
    for(let x=0;x<=W;x+=16){
      const yy = y + Math.sin(x*0.03 + r*1.7 + b.y0)*b.amp;
      x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
}

// the flagship: a regatta boat with its colored jib, sailing the harbor
(function(){
  const x=W-330, y=SHORE+150, S=2.6;
  ctx.save(); ctx.translate(x,y); ctx.scale(S,S); ctx.rotate(-0.05);
  ctx.fillStyle='rgba(20,60,80,.22)';
  ctx.beginPath(); ctx.ellipse(0,15,27,4.5,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-27,10); ctx.quadraticCurveTo(-52,14,-84,9);
  ctx.moveTo(-27,13); ctx.quadraticCurveTo(-47,19,-72,18); ctx.stroke();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(30,40,50,.35)';
  ctx.fillStyle='#1a3a7e';
  ctx.beginPath(); ctx.moveTo(-30,6); ctx.quadraticCurveTo(0,19,33,6);
  ctx.lineTo(23,16); ctx.quadraticCurveTo(0,24,-21,16); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#5a5348'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(2,8); ctx.lineTo(2,-42); ctx.stroke();
  ctx.fillStyle='#f6f1e2';
  ctx.beginPath(); ctx.moveTo(2,-40); ctx.quadraticCurveTo(16,-18,2,5); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='rgba(30,40,50,.35)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#1a3a7e';
  ctx.beginPath(); ctx.moveTo(3,-34); ctx.quadraticCurveTo(20,-15,31,5); ctx.lineTo(3,2); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.moveTo(3,-34); ctx.quadraticCurveTo(12,-16,17,4); ctx.lineTo(3,2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a3a7e';
  ctx.beginPath(); ctx.moveTo(2,-42); ctx.lineTo(12,-39.5); ctx.lineTo(2,-37); ctx.fill();
  ctx.restore();
})();

// title panel
const px=64, py=250, pw=580, ph=170;
ctx.fillStyle='rgba(247,241,227,.96)';
ctx.strokeStyle='#d9cdb4'; ctx.lineWidth=2;
ctx.beginPath(); ctx.roundRect(px,py,pw,ph,18); ctx.fill(); ctx.stroke();
ctx.fillStyle='#1e6f8e'; ctx.fillRect(px,py,pw,6);
// wave glyph
ctx.strokeStyle='#1e6f8e'; ctx.lineWidth=7; ctx.lineCap='round';
ctx.beginPath(); ctx.moveTo(px+34,py+62); ctx.quadraticCurveTo(px+52,py+38,px+70,py+62);
ctx.quadraticCurveTo(px+88,py+86,px+106,py+62); ctx.stroke();
ctx.fillStyle='#232e38';
ctx.font='700 58px "Iowan Old Style",Palatino,Georgia,serif';
ctx.fillText('tide-games', px+128, py+78);
ctx.fillStyle='#5c6a76';
ctx.font='italic 27px Georgia,serif';
ctx.fillText('games that share one sea', px+34, py+120);
ctx.fillStyle='#1e6f8e';
ctx.font='600 18px system-ui,sans-serif';
ctx.fillText('one key · one balance · every game honors it · provably fair', px+34, py+152);

// the fleet moored along the bottom: one motif per boat
function moor(cx, draw){
  ctx.save(); ctx.translate(cx, H-92);
  ctx.fillStyle='rgba(247,241,227,.93)';
  ctx.strokeStyle='#d9cdb4'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-46,-46,92,92,16); ctx.fill(); ctx.stroke();
  draw(); ctx.restore();
}
// tavern die
moor(px+60, ()=>{
  ctx.save(); ctx.rotate(-0.09);
  ctx.fillStyle='#fdfbf4'; ctx.strokeStyle='#cfc6ae'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-28,-28,56,56,10); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#232e38';
  [[-13,-13],[13,13],[13,-13],[-13,13],[0,0]].forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,5.5,0,7); ctx.fill(); });
  ctx.restore();
});
// reef-run chart tile
moor(px+185, ()=>{
  ctx.fillStyle='#efe2c4'; ctx.strokeStyle='rgba(92,74,45,.5)'; ctx.lineWidth=1.5;
  ctx.fillRect(-30,-30,60,60); ctx.strokeRect(-30,-30,60,60);
  ctx.strokeStyle='rgba(92,74,45,.3)';
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,30); ctx.moveTo(-30,0); ctx.lineTo(30,0); ctx.stroke();
  ctx.strokeStyle='rgba(60,55,48,.8)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-19,-19); ctx.lineTo(-5,-5); ctx.moveTo(-5,-19); ctx.lineTo(-19,-5); ctx.stroke();
  ctx.fillStyle='#3d3226';
  ctx.beginPath(); ctx.moveTo(4,22); ctx.lineTo(11,6); ctx.lineTo(16,14); ctx.lineTo(21,2); ctx.lineTo(26,22); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#b0483f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(15,13,14,0,7); ctx.stroke();
});
// poker card
moor(px+310, ()=>{
  ctx.save(); ctx.rotate(0.08);
  ctx.fillStyle='#fdfbf4'; ctx.strokeStyle='#cfc6ae'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-22,-30,44,60,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#b8860b'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(-19,-27,38,54,5); ctx.stroke();
  ctx.fillStyle='#232e38';
  ctx.font='700 26px "Iowan Old Style",Georgia,serif';
  ctx.fillText('A', -15, -6);
  ctx.font='17px system-ui'; ctx.fillText('♠', -14, 14);
  ctx.restore();
});
// tideholm island (the home port)
moor(px+435, ()=>{
  ctx.fillStyle='#79b7cf'; ctx.beginPath(); ctx.roundRect(-32,-32,64,64,12); ctx.fill();
  ctx.fillStyle='#93b8a2';
  ctx.beginPath(); ctx.ellipse(0,6,22,14,0,0,7); ctx.fill();
  ctx.fillStyle='#c2d8cd';
  ctx.beginPath(); ctx.ellipse(-6,2,10,6,0,0,7); ctx.fill();
  ctx.strokeStyle='#5a5348'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(4,-18); ctx.stroke();
  ctx.fillStyle='#c94f4f';
  ctx.beginPath(); ctx.moveTo(4,-18); ctx.lineTo(16,-14.5); ctx.lineTo(4,-11); ctx.fill();
});
ctx.fillStyle='rgba(247,241,227,.85)';
ctx.font='600 16px system-ui'; ctx.textAlign='left';
ctx.fillText('the tavern · reef run · tide poker · tideholm — and room at the dock', px+500, H-86);
</script>
</body>
</html>
